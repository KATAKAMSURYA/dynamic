name: Dynamic Test-Subset Routing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  selective-test:
    name: Route & Run Tests
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout with full history so git diff works across commits
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history required for git diff

      # ----------------------------------------------------------------
      # 2. Set up Python 3.12
      # ----------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------------------
      # 3. Install dependencies
      # ----------------------------------------------------------------
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # ----------------------------------------------------------------
      # 4. Determine base and head SHA for the comparison
      #    • Pull Request  → compare PR base against PR head
      #    • Push          → compare the previous commit against HEAD
      #    • workflow_dispatch / fallback → leave empty (full suite)
      # ----------------------------------------------------------------
      - name: Determine base and head SHA
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # github.event.before is the SHA before the push; may be zeros on first push
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "BASE_SHA=" >> "$GITHUB_OUTPUT"
              echo "HEAD_SHA=" >> "$GITHUB_OUTPUT"
            else
              echo "BASE_SHA=${BEFORE}" >> "$GITHUB_OUTPUT"
              echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          else
            # workflow_dispatch or other events → full-suite fallback
            echo "BASE_SHA=" >> "$GITHUB_OUTPUT"
            echo "HEAD_SHA=" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------
      # 5. Run the dynamic router (falls back to full suite when SHAs
      #    are empty or the diff is unmappable)
      # ----------------------------------------------------------------
      - name: Run dynamic test router
        env:
          BASE_SHA: ${{ steps.refs.outputs.BASE_SHA }}
          HEAD_SHA: ${{ steps.refs.outputs.HEAD_SHA }}
        run: |
          python router/test_router.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
